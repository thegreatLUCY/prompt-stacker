<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <title>Prompt Stacker position regression check</title>
  <link rel="stylesheet" href="../panel.css">
  <style>
    body {font:16px system-ui;background:#fafafa;margin:24px;}
    main {max-width:540px;position:fixed;left:24px;bottom:24px;}
    #results {white-space:pre-wrap;}
  </style>
  <script>
    // Isolated browser fixture: never accesses installed extension storage.
    const fixtureKey = 'prompt-stacker-position-test';
    const area = {
      get(keys,cb) {
        cb({...JSON.parse(localStorage.getItem(fixtureKey) || '{}'),
          cps_queue:[], cps_chains:[], cps_onboarding_dismissed:true});
      },
      set(data,cb) {
        const saved = JSON.parse(localStorage.getItem(fixtureKey) || '{}');
        localStorage.setItem(fixtureKey,JSON.stringify({...saved,...data}));
        cb?.();
      },
    };
    window.chrome = {runtime:{getURL:path=>'../'+path},storage:{local:area,sync:area}};
  </script>
</head>
<body>
  <main>
    <h1>Panel position regression check</h1>
    <p>Uses the real content script and CSS with isolated test storage.</p>
    <button id="run">Run position checks</button>
    <button id="refresh">Refresh to check saved position</button>
    <button id="reset">Reset fixture storage</button>
    <pre id="results" aria-live="polite">Ready.</pre>
  </main>
  <script src="../content.js"></script>
  <script>
    const wait = ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const panel = document.querySelector('#cps-panel');
    const results = document.querySelector('#results');
    const point = ()=>{
      const r=panel.getBoundingClientRect();
      return {left:r.left,top:r.top};
    };
    function dragTo(left,top) {
      const r=panel.getBoundingClientRect();
      const header=panel.querySelector('.cps-header');
      header.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,clientX:r.left+10,clientY:r.top+10}));
      document.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:left+10,clientY:top+10}));
      document.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:left+10,clientY:top+10}));
    }
    function checkPosition(expected,label) {
      const actual=point();
      if(Math.abs(actual.left-expected.left)>1 || Math.abs(actual.top-expected.top)>1)
        throw Error(label+': expected '+JSON.stringify(expected)+', got '+JSON.stringify(actual));
      results.textContent+='PASS: '+label+'\n';
    }
    document.querySelector('#run').onclick=async()=>{
      results.textContent='';
      try {
        await wait(400);
        if(!panel.classList.contains('cps-collapsed')) panel.querySelector('#cps-collapse').click();
        dragTo(100,80);const compact=point();
        panel.querySelector('#cps-collapse').click();await wait(40);
        dragTo(30,130);const expanded=point();
        panel.querySelector('#cps-collapse').click();await wait(40);
        checkPosition(compact,'collapse returns to compact position');
        panel.querySelector('#cps-collapse').click();await wait(40);
        checkPosition(expanded,'expand returns to expanded position');
        panel.querySelector('#cps-collapse').click();await wait(40);
        const saved=JSON.parse(localStorage.getItem(fixtureKey));
        if(!saved.cps_position_chatgpt_collapsed || !saved.cps_position_chatgpt_expanded)
          throw Error('Positions were not saved');
        results.textContent+='PASS: both positions saved separately\n';
        results.textContent+='ALL CHECKS PASSED. Refresh to verify persistence.\n';
      } catch(error){results.textContent+='FAIL: '+error.message;}
    };
    document.querySelector('#refresh').onclick=()=>location.reload();
    document.querySelector('#reset').onclick=()=>{localStorage.removeItem(fixtureKey);location.reload();};
    setTimeout(()=>{
      const saved=JSON.parse(localStorage.getItem(fixtureKey) || '{}').cps_position_chatgpt_collapsed;
      if(saved) {
        results.textContent='';
        try{checkPosition(saved,'saved compact position restored after refresh');}
        catch(error){results.textContent='FAIL: '+error.message;}
      }
    },450);
  </script>
</body>
</html>
